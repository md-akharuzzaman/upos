name: Feature / user story
description: A change to the POS, written as a user story with acceptance criteria
labels: [feature]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      placeholder: As a cashier, I want ..., so that ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria (the tester turns these into tests)
      placeholder: "- Given ... when ... then ..."
    validations:
      required: true
